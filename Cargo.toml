[package]
name = "menu-test"
version = "0.1.0"
edition = "2024"

[dependencies]
topcoat = { version = "0.11", features = ["ui"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde", "v7"] }
tracing = {version ="*"}
chrono = "0.4"
hex = "0.4"
argon2 = "0.5"
password-hash = "0.5"
regex = "1.13"